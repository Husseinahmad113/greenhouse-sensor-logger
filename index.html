
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenhouse Sensor Logger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Greenhouse Sensor Logger</h1>
        <p>Monitor and record greenhouse sensor readings.</p>
    </header>

    
<main>
    <section class="sensor-entry">
        <h2>Record Reading</h2>

        <form id="sensor-form">
         <label for="bay">Greenhouse Bay</label>
<input type="text" id="bay" name="bay" placeholder="Example: Bay 1" required>
<label for="ph">pH Level</label>
 <input type="number" id="ph" name="ph" min="0" max="14" step="0.1" placeholder="Example: 6.5" required>
  
 <label for="ec">Electrical Conductivity (EC) - mS/cm</label>
<input type="number" id="ec" name="ec" min="0" step="0.1" placeholder="Example: 1.5" required>

<label for="temp">Temperature (°F)</label>
<input type="number" id="temp" name="temp" step="0.1" placeholder="Example: 75.0" required>

<label for="humidity">Relative Humidity (%)</label>
<input type="number" id="humidity" name="humidity" min="0" max="100" step="0.1" placeholder="Example: 60.0" required>

<p id="error-message" role="alert" hidden></p>
<button type="submit">Record Reading</button>

</form>
    </section>
    <section class="log-history">
    <h2>Log History</h2>
    <p>Active Records: <span id="record-count">0</span></p>
    <div id="log-list" class="log-list"></div>
    <button type="button" id="purge-all">Purge All</button>
</section>
</main>


    <footer>
        <p>Greenhouse Sensor Logger Dashboard</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
